name: Terraform Validation and Planning

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-validate.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.5.0

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive terraform/ || true

      - name: Terraform Validation
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

  terraform-security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v3

      - name: Initialize TFLint
        run: |
          cd terraform
          tflint --init || true

      - name: Run TFLint
        run: |
          cd terraform
          tflint --format compact || true

      - name: Set up Checkov for Terraform Security
        run: |
          pip install checkov

      - name: Run Checkov Scan
        run: |
          checkov -d terraform/ --framework terraform --compact --skip-download || true

  terraform-plan:
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: Terraform Init
        run: |
          cd terraform
          terraform init -upgrade || true

      - name: Terraform Plan (Dev)
        id: plan
        run: |
          cd terraform
          terraform plan -var-file=environments/dev.tfvars -out=tfplan 2>&1 || echo "Plan completed with warnings"

      - name: Upload Plan File
        uses: actions/upload-artifact@v3
        with:
          name: tfplan
          path: terraform/tfplan
        continue-on-error: true

      - name: Post Plan Comment
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\nTerraform plan completed. Check artifacts for details.`
            });
        continue-on-error: true
